spring:
  application:
    name: AForum
  profiles:
    active:
      - dev

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/aforum?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 10000

  # Flyway 配置
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# PageHelper 配置
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

# MyBatis Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false

# JWT 配置
jwt:
  secret: ${JWT_SECRET:aforum-secret-key-must-be-at-least-256-bits-long-for-hs256}
  expiration: 86400000  # 24小时
  refresh-expiration: 604800000  # 7天
  token-prefix: "Bearer "
  header: Authorization

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /

# 日志配置
logging:
  level:
    root: INFO
    com.example.aforum: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    elasticsearch:
      enabled: ${SEARCH_ENABLED:true}
  endpoint:
    health:
      show-details: when-authorized

# Redis 热点缓存配置
app:
  cache:
    enabled: ${CACHE_ENABLED:true}
    post-list-ttl-seconds: ${CACHE_POST_LIST_TTL_SECONDS:120}
    post-detail-ttl-seconds: ${CACHE_POST_DETAIL_TTL_SECONDS:300}
    search-options-ttl-seconds: ${CACHE_SEARCH_OPTIONS_TTL_SECONDS:600}
    negative-ttl-seconds: ${CACHE_NEGATIVE_TTL_SECONDS:30}

# SpringDoc 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

search:
  enabled: ${SEARCH_ENABLED:true}
  fallback-to-mysql: ${SEARCH_FALLBACK_TO_MYSQL:true}
  elasticsearch:
    uris:
      - ${ELASTICSEARCH_URI:http://localhost:9200}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}
    post-index: ${ELASTICSEARCH_POST_INDEX:aforum_posts}
    post-index-version: ${ELASTICSEARCH_POST_INDEX_VERSION:aforum_posts_v1}
