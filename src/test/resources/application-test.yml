spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:aforum_test;MODE=MySQL;NON_KEYWORDS=USER,COMMENT,ROLE;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:test-schema.sql
      data-locations: classpath:test-data.sql

logging:
  level:
    root: WARN
    com.example.aforum: INFO
    org.springframework.security: WARN

pagehelper:
  helper-dialect: h2

jwt:
  secret: aforum-test-secret-key-must-be-at-least-256-bits-long
  expiration: 86400000
  refresh-expiration: 604800000

search:
  enabled: false
  fallback-to-mysql: true
